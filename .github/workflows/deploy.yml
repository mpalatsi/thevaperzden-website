name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Trigger on pushes to the main branch
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Define the image name on GHCR
  # Format: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY_NAME
  # Replace with your actual username and repository name!
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # Needed to check out the repository
      packages: write      # Needed to push images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN is automatically generated by GitHub Actions
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha # Tag with commit SHA (e.g., ghcr.io/user/repo:abc1234)
            type=raw,value=latest,enable={{is_default_branch}} # Tag with 'latest' only for the default branch (main)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Use the current directory as build context
          push: true # Push the image after building
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 